<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- CSP — XSS 발생 시의 완화층 (Fable.md 보안 finding).
         실용 정책: 핵심은 외부 출처 스크립트 차단(youtube iframe_api만 허용)과
         frame/object 제한. 'unsafe-inline' script는 Vite dev의 react-refresh
         preamble 때문에 필요하고, connect-src https:/wss:는 가변 RAG 터널
         (*.trycloudflare.com)·smplr 사운드폰트 CDN·백엔드를 포괄한다. -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' https://www.youtube.com https://s.ytimg.com;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net;
      font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net;
      img-src 'self' data: blob: https:;
      media-src 'self' blob: https:;
      connect-src 'self' https: wss: ws: blob: data:;
      frame-src https://www.youtube.com https://www.youtube-nocookie.com;
      worker-src 'self' blob:;
      object-src 'none';
      base-uri 'self'">
    <!-- 파비콘 — 앱 로고(jazzifylogo.png)에서 생성. 예전엔 색소폰 이모지를 넣은
         SVG 라 브라우저·OS 마다 다른 모양으로 그려졌다(이모지 폰트 의존).
         .ico 는 16~256px 다중 해상도라 탭·북마크·즐겨찾기에서 각각 선명하다. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#ffffff" />
    <title>Jazzify Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Preload the chord font at top priority so it's already downloaded by
         the time React renders the lead-sheet — eliminates the brief flash of
         DM Sans where chord symbols look broken. crossorigin matches the
         @font-face request so the browser actually uses the preloaded copy. -->
    <link rel="preload" as="font" type="font/otf" href="/MuseJazzText.otf" crossorigin>
    <!-- Bravura: SMuFL 표준 음악 폰트. 팔레트·툴바 버튼의 악보 기호(임시표·
         아티큘레이션·음자리표·세뇨/코다 …)를 실제 악보와 같은 글리프로 찍는다.
         (PDF 내보내기(scoreToPdf)에서도 같은 파일을 임베드한다) -->
    <link rel="preload" as="font" type="font/woff2" href="/bravura.woff2" crossorigin>
    <style>
      @font-face {
        font-family: 'Bravura';
        src: url('/bravura.woff2') format('woff2');
        font-weight: normal;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: 'MuseJazz Text';
        src: url('/MuseJazzText.otf') format('opentype');
        font-weight: normal;
        font-style: normal;
        /* `block` over `swap`: keeps chord text invisible for up to 3s so it
           never paints with the wrong (DM Sans) glyphs in SVG, where browsers
           don't always re-flow after a font swap. Combined with the preload
           above, the wait is typically <100ms in practice. */
        font-display: block;
      }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/studio/main.tsx"></script>
  </body>
</html>
