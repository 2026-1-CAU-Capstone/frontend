# Scale definitions: each scale maps degree (semitones from root) to diatonic chord qualities
# Intervals are in semitones from the root (0-11)

major:
  name: "Major (Ionian)"
  intervals: [0, 2, 4, 5, 7, 9, 11]
  diatonic_qualities:
    0: "maj7"    # I
    2: "min7"    # ii
    4: "min7"    # iii
    5: "maj7"    # IV
    7: "dom7"    # V
    9: "min7"    # vi
    11: "min7b5" # vii

natural_minor:
  name: "Natural Minor (Aeolian)"
  intervals: [0, 2, 3, 5, 7, 8, 10]
  diatonic_qualities:
    0: "min7"    # i
    2: "min7b5"  # ii
    3: "maj7"    # bIII
    5: "min7"    # iv
    7: "min7"    # v
    8: "maj7"    # bVI
    10: "dom7"   # bVII

harmonic_minor:
  name: "Harmonic Minor"
  intervals: [0, 2, 3, 5, 7, 8, 11]
  diatonic_qualities:
    0: "minmaj7"  # i
    2: "min7b5"   # ii
    3: "aug"      # bIII+
    5: "min7"     # iv
    7: "dom7"     # V
    8: "maj7"     # bVI
    11: "dim7"    # vii

melodic_minor:
  name: "Melodic Minor (ascending)"
  intervals: [0, 2, 3, 5, 7, 9, 11]
  diatonic_qualities:
    0: "minmaj7"  # i
    2: "min7"     # ii
    3: "aug"      # bIII+
    5: "dom7"     # IV
    7: "dom7"     # V
    9: "min7b5"   # vi
    11: "min7b5"  # vii

# Modes (all relative to their own root)
dorian:
  name: "Dorian"
  intervals: [0, 2, 3, 5, 7, 9, 10]
  diatonic_qualities:
    0: "min7"
    2: "min7"
    3: "maj7"
    5: "dom7"
    7: "min7"
    9: "min7b5"
    10: "maj7"

phrygian:
  name: "Phrygian"
  intervals: [0, 1, 3, 5, 7, 8, 10]
  diatonic_qualities:
    0: "min7"
    1: "maj7"
    3: "dom7"
    5: "min7"
    7: "min7b5"
    8: "maj7"
    10: "min7"

lydian:
  name: "Lydian"
  intervals: [0, 2, 4, 6, 7, 9, 11]
  diatonic_qualities:
    0: "maj7"
    2: "dom7"
    4: "min7"
    6: "min7b5"
    7: "maj7"
    9: "min7"
    11: "min7"

mixolydian:
  name: "Mixolydian"
  intervals: [0, 2, 4, 5, 7, 9, 10]
  diatonic_qualities:
    0: "dom7"
    2: "min7"
    4: "min7b5"
    5: "maj7"
    7: "min7"
    9: "min7"
    10: "maj7"

locrian:
  name: "Locrian"
  intervals: [0, 1, 3, 5, 6, 8, 10]
  diatonic_qualities:
    0: "min7b5"
    1: "maj7"
    3: "min7"
    5: "min7"
    6: "maj7"
    8: "min7"
    10: "min7"
